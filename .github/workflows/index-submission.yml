name: Automated Index Submission

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 21 * * *'

jobs:
  submit-to-engines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install googleapis xml2js node-fetch

      - name: Run IndexNow Submission
        run: node packages/config/src/scripts/submit-indexnow.mjs

      - name: Commit IndexNow State
        run: |
          if ! git diff --quiet packages/config/src/scripts/indexnow-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/config/src/scripts/indexnow-state.json
            git commit -m "chore: update indexnow submission state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Run Google Indexing API
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
        run: node packages/config/src/scripts/submit-google-indexing.mjs
